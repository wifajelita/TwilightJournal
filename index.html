<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwilightJournal — Cosmic Diary</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">✦</span>
        <h1>Twilight<span>Journal</span></h1>
      </div>

      <button class="btn btn-primary" id="btnNewEntry">
        <span>+</span> Entri Baru
      </button>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari entri..." autocomplete="off" />
      </div>

      <div class="filter-row">
        <select id="filterMood">
          <option value="all">Semua Mood</option>
          <option value="happy">😊 Happy</option>
          <option value="calm">😌 Calm</option>
          <option value="sad">😢 Sad</option>
          <option value="excited">🤩 Excited</option>
          <option value="thoughtful">🤔 Thoughtful</option>
          <option value="grateful">🙏 Grateful</option>
        </select>
      </div>

      <div class="entry-list" id="entryList">
        <!-- Entries will be rendered here -->
      </div>

      <div class="sidebar-footer">
        <button class="btn btn-ghost" id="btnExport" title="Export JSON">Export</button>
        <button class="btn btn-ghost" id="btnImport" title="Import JSON">Import</button>
        <input type="file" id="importFile" accept=".json" hidden />
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✦</div>
        <h2>Selamat datang di TwilightJournal</h2>
        <p>Catat perjalananmu di antara bintang-bintang.<br />Klik <strong>+ Entri Baru</strong> untuk memulai.</p>
      </div>

      <div class="editor-view" id="editorView" hidden>
        <div class="editor-header">
          <input type="text" id="entryTitle" placeholder="Judul entri..." maxlength="120" />
          <div class="editor-meta">
            <input type="date" id="entryDate" />
            <select id="entryMood">
              <option value="happy">😊 Happy</option>
              <option value="calm">😌 Calm</option>
              <option value="sad">😢 Sad</option>
              <option value="excited">🤩 Excited</option>
              <option value="thoughtful">🤔 Thoughtful</option>
              <option value="grateful">🙏 Grateful</option>
            </select>
          </div>
        </div>

        <textarea id="entryContent" placeholder="Tulis isi hatimu di sini..."></textarea>

        <div class="editor-actions">
          <button class="btn btn-danger" id="btnDelete" hidden>Hapus</button>
          <div class="spacer"></div>
          <button class="btn btn-ghost" id="btnCancel">Batal</button>
          <button class="btn btn-primary" id="btnSave">Simpan</button>
        </div>
      </div>

      <div class="view-mode" id="viewMode" hidden>
        <div class="view-header">
          <h2 id="viewTitle"></h2>
          <div class="view-meta">
            <span id="viewDate"></span>
            <span id="viewMood"></span>
          </div>
        </div>
        <div class="view-content" id="viewContent"></div>
        <div class="view-actions">
          <button class="btn btn-ghost" id="btnBack">← Kembali</button>
          <button class="btn btn-primary" id="btnEdit">Edit</button>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
